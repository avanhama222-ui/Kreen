<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0b5d4b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="کڕین">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<title>حسابی کڕینی دوکان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap">
<style>
/* Layout: app shell. Colored header with the screen's key number, one screen per tab, bottom tab bar, add-sheet slides up from the bottom. */
:root{
  --bg:#eef2f0; --card:#ffffff; --ink:#15211d; --muted:#6b7a74; --line:#e3e9e6;
  --brand:#0b5d4b; --brand-2:#0e7c64; --brand-soft:#e1f1ec; --on-brand:#ffffff;
  --red:#c8412d; --red-soft:#fbe9e5; --green:#11845f;
  --f:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1412; --card:#17201d; --ink:#e7eeeb; --muted:#93a39c; --line:#26322e;
  --brand:#0b5d4b; --brand-2:#13a17f; --brand-soft:#173a31; --on-brand:#ffffff;
  --red:#f07c66; --red-soft:#3a201a; --green:#4fd1a1; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1412; --card:#17201d; --ink:#e7eeeb; --muted:#93a39c; --line:#26322e;
  --brand:#0b5d4b; --brand-2:#13a17f; --brand-soft:#173a31; --on-brand:#ffffff;
  --red:#f07c66; --red-soft:#3a201a; --green:#4fd1a1; color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.5}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

/* header */
.top{background:var(--brand);color:var(--on-brand);padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 26px;border-radius:0 0 28px 28px}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:40px}
.top h1{margin:0;font-size:1.15rem;font-weight:700;display:flex;align-items:center;gap:10px;min-width:0}
.top h1 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{background:rgba(255,255,255,.14);border:0;color:var(--on-brand);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:22px;height:22px}
.hero{margin-top:18px}
.hero .lbl{opacity:.8;font-size:.92rem}
.hero .big{font-size:2.3rem;font-weight:800;line-height:1.15;margin-top:2px}
.hero .sub{margin-top:6px;opacity:.85;font-size:.95rem}
.hero .sub b{font-weight:700}

/* content */
main{padding:16px 16px calc(110px + env(safe-area-inset-bottom,0px));max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sec-title{font-size:.95rem;color:var(--muted);margin:6px 4px 0;font-weight:500}
.card{background:var(--card);border-radius:20px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;min-height:62px}
.row:last-child{border-bottom:0}
.row:active{background:var(--bg)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--brand-soft);color:var(--brand-2);display:grid;place-items:center;font-weight:800;flex:none;font-size:1.05rem}
.avatar.k-debt{background:var(--red-soft);color:var(--red)}
.avatar.k-cash{background:var(--bg);color:var(--muted)}
.row .mid{flex:1;min-width:0;display:flex;flex-direction:column}
.row .name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font-size:.82rem;color:var(--muted)}
.row .end{text-align:left;display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.row .amt{font-weight:800}
.pill{font-size:.75rem;font-weight:700;padding:1px 9px;border-radius:999px;white-space:nowrap}
.pill.debt{background:var(--red-soft);color:var(--red)}
.pill.paid{background:var(--brand-soft);color:var(--green)}
.pill.cash{background:var(--bg);color:var(--muted)}
.red{color:var(--red)} .green{color:var(--green)}
.chev{color:var(--muted);font-size:1.3rem;flex:none}

.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:6px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat span{font-size:.78rem;color:var(--muted)}
.stat b{font-size:.86rem;font-weight:800;overflow-wrap:anywhere}

.btn{border:0;border-radius:16px;padding:15px 18px;font-weight:700;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--brand-2);color:#fff}
.btn.danger{background:var(--red);color:#fff}
.btn.light{background:var(--card);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.block{width:100%}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1}
.hero-btn{margin-top:16px;background:#fff;color:var(--brand);border:0;border-radius:14px;padding:12px 18px;font-weight:800;cursor:pointer}

/* tab bar */
.tabs{position:fixed;inset-inline:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tab{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:.78rem;cursor:pointer}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--brand-2);font-weight:700}
.fab{position:fixed;bottom:calc(78px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:auto;white-space:nowrap;padding:14px 26px;border-radius:999px;background:var(--brand-2);color:#fff;border:0;font-weight:800;font-size:1.05rem;box-shadow:0 8px 24px rgba(11,93,75,.35);z-index:6;display:flex;gap:8px;align-items:center;cursor:pointer}
.fab svg{width:22px;height:22px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:11;background:var(--card);border-radius:26px 26px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .25s ease;max-width:620px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h2{margin:0 0 14px;font-size:1.2rem;text-align:center}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label{font-size:.88rem;color:var(--muted)}
input{font:inherit;font-size:1.05rem;color:var(--ink);background:var(--bg);border:2px solid transparent;border-radius:14px;padding:13px 14px;width:100%;min-width:0;outline:none}
input:focus{border-color:var(--brand-2)}
input.money{font-size:1.8rem;font-weight:800;text-align:center;padding:10px}
.names{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.names::-webkit-scrollbar{display:none}
.names:empty{display:none}
.nchip{flex:none;border:0;background:var(--bg);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:.92rem}
.nchip.sel{background:var(--brand-2);color:#fff}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:11px;padding:11px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.seg.paytype button[aria-pressed="true"].isdebt{background:var(--red);color:#fff}
.seg.paytype button[aria-pressed="true"].iscash{background:var(--brand-2);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:.82rem;color:var(--muted);text-align:center;margin:4px 0 12px}
.link{background:none;border:0;color:var(--brand-2);font-weight:700;cursor:pointer;padding:6px;display:block;margin:6px auto 0}

.toast{position:fixed;inset-inline:16px;top:calc(env(safe-area-inset-top,0px) + 12px);margin:auto;max-width:380px;background:var(--ink);color:var(--card);padding:12px 16px;border-radius:14px;text-align:center;z-index:20;opacity:0;transform:translateY(-10px);transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.setting{padding:16px;display:flex;flex-direction:column;gap:10px}
.setting p{margin:0;color:var(--muted);font-size:.88rem}
.daytitle{display:flex;justify-content:space-between;margin:8px 4px 0;color:var(--muted);font-size:.9rem}
@media (prefers-reduced-motion:reduce){.sheet,.scrim,.toast{transition:none}}
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <button class="iconbtn" id="back" hidden aria-label="گەڕانەوە"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
    <h1><span id="title">ئەمڕۆ</span></h1>
    <span style="width:40px"></span>
  </div>
  <div class="hero">
    <div class="lbl" id="h-lbl"></div>
    <div class="big num" id="h-big"></div>
    <div class="sub" id="h-sub"></div>
    <button class="hero-btn" id="h-btn" hidden></button>
  </div>
</header>

<main id="main"></main>

<button class="fab" id="fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>کڕینی نوێ</button>

<nav class="tabs" role="tablist">
  <button class="tab" role="tab" data-tab="home" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>ئەمڕۆ</button>
  <button class="tab" role="tab" data-tab="shops" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9l1.5-5h13L20 9M4 9h16v11H4zM9 20v-6h6v6"/></svg>دوکانەکان</button>
  <button class="tab" role="tab" data-tab="debts" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg>قەرزەکان</button>
  <button class="tab" role="tab" data-tab="more" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>زیاتر</button>
</nav>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" hidden role="dialog" aria-modal="true">
  <div class="grab"></div>
  <h2 id="s-title">کڕینی نوێ</h2>
  <form id="f" autocomplete="off">
    <div class="field">
      <label for="f-shop">ناوی دوکان</label>
      <input id="f-shop" placeholder="ناو بنووسە یان لە خوارەوە هەڵبژێرە">
      <div class="names" id="names"></div>
    </div>
    <div class="field">
      <label for="f-amt" id="amt-lbl">نرخی کڕین</label>
      <input id="f-amt" class="money num" type="number" inputmode="decimal" min="0" step="any" placeholder="0">
    </div>
    <div class="two" style="margin-bottom:14px">
      <div class="seg" id="cur-seg"><button type="button" data-c="IQD" aria-pressed="true">دینار</button><button type="button" data-c="USD" aria-pressed="false">دۆلار</button></div>
      <div class="seg paytype" id="pay-seg"><button type="button" class="iscash" data-d="0" aria-pressed="true">نەقد</button><button type="button" class="isdebt" data-d="1" aria-pressed="false">قەرز</button></div>
    </div>
    <div class="field" id="old-date" hidden>
      <label for="f-date">بەرواری قەرزەکە (ئەگەر بیرت نییە بەتاڵی بهێڵە)</label>
      <input id="f-date" type="date">
    </div>
    <p class="hint" id="f-hint"></p>
    <div class="btn-row">
      <button class="btn primary" type="submit" id="f-save">پاشەکەوت</button>
      <button class="btn danger" type="button" id="f-del" hidden>سڕینەوە</button>
    </div>
    <button class="link" type="button" id="f-old">+ زیادکردنی قەرزی کۆن</button>
  </form>
</section>

<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const fmtIQD=n=>Math.round(n).toLocaleString('en-US')+' IQD';
  const fmtUSD=n=>'$'+(Math.round(n*100)/100).toLocaleString('en-US');
  const fmt=(n,c)=>c==='USD'?fmtUSD(n):fmtIQD(n);
  const both=(i,u)=>[i?fmtIQD(i):'',u?fmtUSD(u):''].filter(Boolean).join(' + ')||'0';
  const pad=n=>String(n).padStart(2,'0');
  const dayOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const today=()=>dayOf(new Date());
  const timeOf=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes());};
  const K='kreen-rows', R='kreen-rate';
  const MONTHS=['کانوونی دووەم','شوبات','ئازار','نیسان','ئایار','حوزەیران','تەممووز','ئاب','ئەیلوول','تشرینی یەکەم','تشرینی دووەم','کانوونی یەکەم'];
  const prettyDay=d=>{ if(!d) return 'بەرواری نەزانراو'; if(d===today()) return 'ئەمڕۆ'; const y=new Date(); y.setDate(y.getDate()-1); if(d===dayOf(y)) return 'دوێنێ'; const p=d.split('-'); return (+p[2])+'ی '+MONTHS[+p[1]-1]+' '+p[0]; };

  let rows=[], rate=0;
  let tab='home', shop=null;     // shop: open shop page
  let form={cur:'IQD',debt:false,old:false,editing:null};

  function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
  function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1900);}
  function persist(){try{localStorage.setItem(K,JSON.stringify(rows));}catch(e){toast('پاشەکەوت نەکرا');}}
  function normalize(r){ if(!r||!r.shop) return null; if(r.amount==null) r.amount=(Number(r.qty)||1)*(Number(r.price)||0); r.type=r.type||'buy'; r.currency=r.currency||'IQD'; return r; }
  const isBuy=r=>r.type!=='pay'&&r.type!=='old';

  function summary(name){
    const s={buy:{IQD:0,USD:0},paid:{IQD:0,USD:0},owe:{IQD:0,USD:0},n:0,last:0};
    for(const r of rows){ if(r.shop!==name) continue; s.n++; s.last=Math.max(s.last,r.ts||0);
      if(r.type==='pay'){ s.paid[r.currency]+=r.amount; s.owe[r.currency]-=r.amount; }
      else if(r.type==='old'){ s.owe[r.currency]+=r.amount; }
      else { s.buy[r.currency]+=r.amount; if(r.debt) s.owe[r.currency]+=r.amount; else s.paid[r.currency]+=r.amount; } }
    s.owe.IQD=s.owe.IQD>0.5?s.owe.IQD:0; s.owe.USD=s.owe.USD>0.005?s.owe.USD:0;
    return s;
  }
  function names(){ const m=new Map(); rows.forEach(r=>m.set(r.shop,Math.max(m.get(r.shop)||0,r.ts||0))); return [...m.entries()].sort((a,b)=>b[1]-a[1]).map(e=>e[0]); }
  function totalDebt(){ let i=0,u=0; names().forEach(n=>{const s=summary(n); i+=s.owe.IQD; u+=s.owe.USD;}); return {i,u}; }

  function kindOf(r){
    if(r.type==='pay') return ['قەرز دراوەتەوە','paid'];
    if(r.type==='old') return ['قەرزی کۆن','debt'];
    return r.debt ? ['بە قەرز','debt'] : ['نەقد','cash'];
  }
  function entryRow(r, opts={}){
    const row=el('div','row'); row.tabIndex=0; row.setAttribute('role','button');
    if(opts.noName){ const k=kindOf(r)[1]; row.appendChild(el('div','avatar k-'+k, k==='paid'?'↓':k==='debt'?'!':'✓')); }
    else row.appendChild(el('div','avatar',(r.shop||'?').trim().charAt(0)));
    const mid=el('div','mid');
    mid.appendChild(el('span','name',opts.noName ? kindOf(r)[0] : r.shop));
    const when = r.type==='old' ? prettyDay(r.date) : (opts.showDay ? prettyDay(r.date)+' · ' : '')+timeOf(r.ts||0);
    mid.appendChild(el('span','meta num',when));
    const end=el('div','end');
    end.appendChild(el('span','amt num'+(r.type==='pay'?' green':''),(r.type==='pay'?'− ':'')+fmt(r.amount,r.currency)));
    const k=kindOf(r); if(!opts.noName) end.appendChild(el('span','pill '+k[1],k[0]));
    if(opts.bal) end.appendChild(el('span','meta num','ماوە: '+opts.bal));
    row.append(mid,end);
    row.onclick=()=>openForm(r); row.onkeydown=e=>{if(e.key==='Enter')openForm(r);};
    return row;
  }
  function nameRow(n, right, rightCls){
    const row=el('div','row'); row.tabIndex=0; row.setAttribute('role','button');
    row.appendChild(el('div','avatar',n.trim().charAt(0)));
    const mid=el('div','mid'); mid.appendChild(el('span','name',n)); row.appendChild(mid);
    if(right) row.appendChild(el('span','amt num '+(rightCls||''),right));
    row.appendChild(el('span','chev','‹'));
    row.onclick=()=>openShop(n); row.onkeydown=e=>{if(e.key==='Enter')openShop(n);};
    return row;
  }
  function empty(t,s){ const c=el('div','card'); const e=el('div','empty'); e.appendChild(el('b',null,t)); if(s) e.append(s); c.appendChild(e); return c; }
  function hero(lbl,big,sub,btn){
    $('h-lbl').textContent=lbl; $('h-big').textContent=big; $('h-sub').innerHTML=''; if(sub) $('h-sub').append(...sub);
    const b=$('h-btn'); if(btn){ b.hidden=false; b.textContent=btn[0]; b.onclick=btn[1]; } else b.hidden=true;
  }
  const bold=t=>el('b','num',t);

  // ---------- screens ----------
  function render(){
    const m=$('main'); m.textContent='';
    document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected', t.dataset.tab===tab));
    $('back').hidden=!shop; $('fab').hidden = tab==='more' && !shop;
    if(shop) return renderShop(m);
    ({home:renderHome,shops:renderShops,debts:renderDebts,more:renderMore})[tab](m);
  }

  function renderHome(m){
    $('title').textContent='ئەمڕۆ';
    const t=rows.filter(r=>r.date===today()&&r.type!=='old');
    let i=0,u=0,di=0,du=0; t.forEach(r=>{ if(isBuy(r)){ if(r.currency==='USD'){u+=r.amount; if(r.debt) du+=r.amount;} else {i+=r.amount; if(r.debt) di+=r.amount;} } });
    const sub=[]; if(u) sub.push('دۆلار: ',bold(fmtUSD(u)),'   ');
    sub.push('بە قەرز: ',bold(both(di,du)));
    hero('کۆی کڕینی ئەمڕۆ', fmtIQD(i), sub);
    if(!t.length){ m.appendChild(empty('ئەمڕۆ هیچت نەکڕیوە','دوگمەی «کڕینی نوێ» دابگرە بۆ تۆمارکردنی یەکەم کڕین.')); return; }
    m.appendChild(el('div','sec-title','کڕینەکانی ئەمڕۆ'));
    const c=el('div','card'); t.sort((a,b)=>(b.ts||0)-(a.ts||0)).forEach(r=>c.appendChild(entryRow(r))); m.appendChild(c);
  }

  function renderShops(m){
    $('title').textContent='دوکانەکان';
    const ns=names();
    let i=0,u=0; rows.forEach(r=>{ if(isBuy(r)){ if(r.currency==='USD') u+=r.amount; else i+=r.amount; } });
    hero('کۆی کڕین لە هەموو دوکانەکان', fmtIQD(i), [bold(String(ns.length)),' دوکان', ...(u?['   دۆلار: ',bold(fmtUSD(u))]:[])]);
    if(!ns.length){ m.appendChild(empty('هێشتا هیچ دوکانێک نییە','کە یەکەم کڕینت تۆمار کرد، ناوی دوکانەکە لێرە دەردەکەوێت.')); return; }
    const c=el('div','card'); ns.forEach(n=>c.appendChild(nameRow(n))); m.appendChild(c);
  }

  function renderDebts(m){
    $('title').textContent='قەرزەکان';
    const d=totalDebt();
    const owing=names().map(n=>[n,summary(n)]).filter(([,s])=>s.owe.IQD||s.owe.USD);
    hero('کۆی قەرزەکانم', fmtIQD(d.i), [...(d.u?['دۆلار: ',bold(fmtUSD(d.u)),'   ']:[]), bold(String(owing.length)),' کەس']);
    if(rate>0 && d.u) $('h-sub').append('   هەمووی بە دینار: ', bold(fmtIQD(d.i+d.u*rate)));
    if(!owing.length){ m.appendChild(empty('هیچ قەرزێکت نییە 👌','کاتێک شتێک بە قەرز دەکڕیت، لێرە دەردەکەوێت.')); }
    else { const c=el('div','card'); owing.forEach(([n,s])=>c.appendChild(nameRow(n,both(s.owe.IQD,s.owe.USD),'red'))); m.appendChild(c); }
    const b=el('button','btn light block','+ زیادکردنی قەرزی کۆن'); b.onclick=()=>openForm(null,{old:true}); m.appendChild(b);
  }

  function renderShop(m){
    const s=summary(shop);
    $('title').textContent=shop;
    const owe=s.owe.IQD||s.owe.USD;
    hero(owe?'قەرزی ماوە':'حسابی ئەم دوکانە', owe?both(s.owe.IQD,s.owe.USD):'بێ قەرز', null, owe?['دانەوەی قەرز',()=>openPay(shop,s)]:null);
    const st=el('div','stats');
    [['کۆی کڕین',both(s.buy.IQD,s.buy.USD),''],['دراوە',both(s.paid.IQD,s.paid.USD),'green'],['قەرز',both(s.owe.IQD,s.owe.USD),owe?'red':'']].forEach(([a,b,c])=>{ const d=el('div','stat'); d.append(el('span',null,a), el('b','num '+c,b)); st.appendChild(d); });
    m.appendChild(st);
    m.appendChild(el('div','sec-title','هەموو مامەڵەکان'));
    const items=rows.filter(r=>r.shop===shop).sort((a,b)=>(a.ts||0)-(b.ts||0));
    const run={IQD:0,USD:0}; const out=[];
    for(const r of items){ if(r.type==='pay') run[r.currency]-=r.amount; else if(r.type==='old'||r.debt) run[r.currency]+=r.amount;
      out.push(entryRow(r,{noName:true,showDay:true,bal:both(Math.max(run.IQD,0),Math.max(run.USD,0))})); }
    const c=el('div','card'); out.reverse().forEach(x=>c.appendChild(x)); m.appendChild(c);
  }

  function renderMore(m){
    $('title').textContent='زیاتر';
    hero('هەموو کڕینەکان', fmtIQD(rows.filter(isBuy).filter(r=>r.currency!=='USD').reduce((a,r)=>a+r.amount,0)), [bold(String(rows.length)),' تۆمار']);
    // backup
    const bk=el('div','card'); const s1=el('div','setting');
    let last=null; try{ last=localStorage.getItem('kreen-lastbackup'); }catch(e){}
    s1.append(el('b',null,'باکئەپ'), el('p',null,'زانیارییەکان تەنها لەناو ئەم مۆبایلەدان. هەفتەی جارێک باکئەپ بگرە و بۆ خۆتی بنێرە لە WhatsApp یان Telegram. '+(last?'دوایین باکئەپ: '+last:'هێشتا باکئەپت نەگرتووە.')));
    const br=el('div','btn-row'); const ex=el('button','btn primary','گرتنی باکئەپ'); const im=el('button','btn light','گەڕاندنەوە');
    im.style.background='var(--bg)'; ex.onclick=exportBackup; im.onclick=()=>$('b-file').click(); br.append(ex,im); s1.appendChild(br); bk.appendChild(s1); m.appendChild(bk);
    // rate
    const rc=el('div','card'); const s2=el('div','setting');
    s2.append(el('b',null,'نرخی دۆلار'), el('p',null,'ئەگەر بینووسیت، قەرزی دۆلار و دینار پێکەوە بە دینار کۆ دەکرێنەوە.'));
    const ri=el('input','num'); ri.type='number'; ri.inputMode='numeric'; ri.placeholder='بۆ نموونە 1450'; ri.value=rate||''; ri.id='rate';
    ri.oninput=()=>{ rate=parseFloat(ri.value)||0; try{localStorage.setItem(R,String(rate));}catch(e){} };
    s2.appendChild(ri); rc.appendChild(s2); m.appendChild(rc);
    // history
    m.appendChild(el('div','sec-title','مێژووی کڕین بە ڕۆژ'));
    const days=new Map(); rows.filter(r=>r.type!=='old').forEach(r=>{ if(!days.has(r.date)) days.set(r.date,[]); days.get(r.date).push(r); });
    const ds=[...days.keys()].sort().reverse();
    if(!ds.length){ m.appendChild(empty('هیچ تۆمارێک نییە')); return; }
    ds.slice(0,60).forEach(d=>{
      const list=days.get(d); let i=0,u=0; list.forEach(r=>{ if(isBuy(r)){ if(r.currency==='USD') u+=r.amount; else i+=r.amount; } });
      const t=el('div','daytitle'); t.append(el('span',null,prettyDay(d)), el('span','num',both(i,u))); m.appendChild(t);
      const c=el('div','card'); list.sort((a,b)=>(b.ts||0)-(a.ts||0)).forEach(r=>c.appendChild(entryRow(r))); m.appendChild(c);
    });
  }

  // ---------- navigation ----------
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{ tab=t.dataset.tab; shop=null; render(); window.scrollTo(0,0); });
  function openShop(n){ shop=n; render(); window.scrollTo(0,0); }
  $('back').onclick=()=>{ shop=null; render(); };

  // ---------- form sheet ----------
  function showSheet(){ $('scrim').hidden=false; $('sheet').hidden=false; requestAnimationFrame(()=>{ $('scrim').classList.add('on'); $('sheet').classList.add('on'); }); }
  function hideSheet(){ $('scrim').classList.remove('on'); $('sheet').classList.remove('on'); setTimeout(()=>{ $('scrim').hidden=true; $('sheet').hidden=true; },220); }
  $('scrim').onclick=hideSheet;

  function setSeg(id,attr,val){ document.querySelectorAll('#'+id+' button').forEach(b=>b.setAttribute('aria-pressed', b.dataset[attr]===String(val))); }
  document.querySelectorAll('#cur-seg button').forEach(b=>b.onclick=()=>{ form.cur=b.dataset.c; setSeg('cur-seg','c',form.cur); });
  document.querySelectorAll('#pay-seg button').forEach(b=>b.onclick=()=>{ form.debt=b.dataset.d==='1'; setSeg('pay-seg','d',form.debt?1:0); });

  let delArmed=false, payCtx=null;
  function openForm(r, o={}){
    form={cur:r?r.currency:'IQD', debt:r?!!r.debt:false, old:r?r.type==='old':!!o.old, editing:r?r.id:null};
    payCtx=o.pay||null; delArmed=false;
    const isPay = (r&&r.type==='pay') || !!payCtx;
    $('s-title').textContent = payCtx?'دانەوەی قەرز': r ? (r.type==='pay'?'دەستکاری پارەدان':form.old?'دەستکاری قەرزی کۆن':'دەستکاری کڕین') : form.old?'قەرزی کۆن':'کڕینی نوێ';
    $('amt-lbl').textContent = isPay?'بڕی پارە':form.old?'بڕی قەرز':'نرخی کڕین';
    $('f-shop').value = r?r.shop : payCtx?payCtx.shop : shop||'';
    $('f-amt').value = r?r.amount : payCtx?payCtx.amount : '';
    $('pay-seg').hidden = isPay||form.old; $('old-date').hidden=!form.old; $('f-date').value = r&&form.old ? (r.date||'') : '';
    $('f-del').hidden=!r; $('f-del').textContent='سڕینەوە';
    $('f-old').hidden = !!r || isPay || form.old;
    $('f-hint').textContent = r ? (r.type==='old'?'':'تۆمار کراوە: '+prettyDay(r.date)+' '+timeOf(r.ts||0)) : payCtx ? 'قەرزی ماوە: '+payCtx.oweText : form.old ? 'قەرزی کۆن ناچێتە سەر کڕینی ئەمڕۆ.' : 'بەروار و کات خۆی دادەنرێت.';
    if(payCtx) form.cur=payCtx.cur;
    setSeg('cur-seg','c',form.cur); setSeg('pay-seg','d',form.debt?1:0);
    $('f-shop').readOnly=!!payCtx;
    renderNames(); showSheet();
    if(!r && !payCtx) setTimeout(()=>($('f-shop').value?$('f-amt'):$('f-shop')).focus(),260);
  }
  $('fab').onclick=()=>openForm(null);
  $('f-old').onclick=()=>openForm(null,{old:true});

  function openPay(n,s){
    const cur = s.owe.IQD ? 'IQD':'USD';
    openForm(null,{pay:{shop:n, cur, amount: cur==='IQD'?Math.round(s.owe.IQD):s.owe.USD, oweText: both(s.owe.IQD,s.owe.USD), s}});
  }

  function renderNames(){
    const box=$('names'); box.textContent='';
    if(payCtx || form.editing) return;
    const q=$('f-shop').value.trim();
    names().filter(n=>!q||n.includes(q)).slice(0,30).forEach(n=>{
      const b=el('button','nchip'+(n===q?' sel':''),n); b.type='button';
      b.onclick=()=>{ $('f-shop').value=n; renderNames(); $('f-amt').focus(); };
      box.appendChild(b);
    });
  }
  $('f-shop').addEventListener('input',renderNames);

  $('f-del').onclick=()=>{
    if(!delArmed){ delArmed=true; $('f-del').textContent='دڵنیای؟'; return; }
    rows=rows.filter(x=>x.id!==form.editing); persist(); hideSheet(); render(); toast('سڕایەوە');
  };

  $('f').addEventListener('submit',e=>{
    e.preventDefault();
    const name=$('f-shop').value.trim(), amount=parseFloat($('f-amt').value);
    if(!name){ toast('ناوی دوکان بنووسە'); $('f-shop').focus(); return; }
    if(!(amount>0)){ toast('بڕی پارە بنووسە'); $('f-amt').focus(); return; }
    const now=Date.now(), id=()=>now.toString(36)+Math.random().toString(36).slice(2,6);
    if(form.editing){
      const r=rows.find(x=>x.id===form.editing);
      if(r){ r.shop=name; r.amount=amount; r.currency=form.cur; if(r.type==='old') r.date=$('f-date').value||''; else if(r.type!=='pay') r.debt=form.debt; }
      persist(); hideSheet(); render(); toast('پاشەکەوت کرا'); return;
    }
    if(payCtx){
      const owed = form.cur==='IQD'?payCtx.s.owe.IQD:payCtx.s.owe.USD;
      if(!(owed>0)){ toast('بەم دراوە قەرزت لای نییە'); return; }
      if(amount>owed+1e-9){ toast('قەرزەکە تەنها '+fmt(owed,form.cur)+'یە'); $('f-amt').value=form.cur==='IQD'?Math.round(owed):owed; return; }
      rows.push({id:'p'+id(),type:'pay',shop:name,amount,currency:form.cur,debt:false,date:today(),ts:now});
      persist(); hideSheet(); render(); toast(fmt(amount,form.cur)+' درایەوە'); return;
    }
    if(form.old){
      const d=$('f-date').value||'';
      rows.push({id:'o'+id(),type:'old',shop:name,amount,currency:form.cur,debt:true,date:d,ts:d?Date.parse(d+'T12:00:00'):0});
      persist(); hideSheet(); render(); toast('قەرزی کۆن زیاد کرا'); return;
    }
    rows.push({id:'b'+id(),type:'buy',shop:name,amount,currency:form.cur,debt:form.debt,date:today(),ts:now});
    persist(); hideSheet(); render(); toast('زیاد کرا ✓');
  });

  // ---------- backup ----------
  async function exportBackup(){
    const data=JSON.stringify({app:'kreen',version:3,exported:new Date().toISOString(),rate,rows},null,1);
    const name='kreen-backup-'+today()+'.json'; const blob=new Blob([data],{type:'application/json'}); let done=false;
    try{ const file=new File([blob],name,{type:'application/json'}); if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:name}); done=true; } }catch(e){ if(e&&e.name==='AbortError') return; }
    if(!done){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); }
    try{ localStorage.setItem('kreen-lastbackup',today()); }catch(e){}
    toast('باکئەپ ئامادە بوو'); render();
  }
  const fi=document.createElement('input'); fi.type='file'; fi.accept='.json,application/json'; fi.id='b-file'; fi.hidden=true; document.body.appendChild(fi);
  fi.onchange=async e=>{
    const f=e.target.files[0]; e.target.value=''; if(!f) return;
    try{ const j=JSON.parse(await f.text()); if(!j||!Array.isArray(j.rows)) throw 0;
      const map=new Map(rows.map(r=>[r.id,r])); j.rows.map(normalize).filter(Boolean).forEach(r=>{ if(r.id) map.set(r.id,r); });
      rows=[...map.values()]; persist(); if(j.rate&&!rate){ rate=Number(j.rate)||0; try{localStorage.setItem(R,String(rate));}catch(e){} }
      render(); toast(j.rows.length+' تۆمار گەڕایەوە');
    }catch(err){ toast('ئەم فایلە باکئەپی ئەم ئەپە نییە'); }
  };

  // ---------- start ----------
  try{ rows=(JSON.parse(localStorage.getItem(K)||'[]')||[]).map(normalize).filter(Boolean); rate=parseFloat(localStorage.getItem(R))||0; }catch(e){ rows=[]; }
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  render();
  if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
})();
</script>
</body>
</html>
